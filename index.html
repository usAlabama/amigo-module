<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Hello, World! — Эра зарождения интернета</title>
    <style>
        /* Обнуляем отступы и делаем фон чёрным, как на старых мониторах */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Цвет фона как у выключенного ЭЛТ-экрана — глубокий чёрный */
            background-color: #000000;
            /* Для имитации лёгкого «зерна» старого дисплея (опционально) */
            background-image: radial-gradient(rgba(0, 255, 0, 0.02) 1px, transparent 1px);
            background-size: 4px 4px;
            
            /* Высота на весь экран (даже в Telegram WebView) */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            
            /* Моноширинный шрифт — классика терминалов 70-х–80-х */
            font-family: 'Courier New', 'Courier', 'VT323', monospace;
            
            /* Добавляем мягкое свечение, как у люминофора */
            text-shadow: 0 0 3px #0f0, 0 0 1px #0f0;
        }

        /* Контейнер для сообщения, чтобы управлять отступами и центровкой */
        .terminal {
            text-align: center;
            padding: 2rem;
            /* Небольшая рамка в стиле «зелёный монитор» */
            border: 2px solid #0f0;
            border-radius: 12px;
            background-color: #000000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            max-width: 90vw;
            transition: all 0.2s ease;
        }

        /* Огромный, величественный «Hello, World!» */
        .hello {
            font-size: clamp(2.5rem, 15vw, 6rem);
            font-weight: bold;
            color: #0f0;
            letter-spacing: 2px;
            word-break: break-word;
            
            /* Эффект мерцания, как у старых ЭЛТ (не слишком агрессивно) */
            animation: subtleGlow 3s infinite alternate;
        }

        /* Дополнительная стилизация — строка приглашения (как в старых терминалах) */
        .prompt {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            color: #0a0;
            border-top: 1px dashed #0f0;
            padding-top: 1.2rem;
            display: inline-block;
            font-family: inherit;
        }

        /* Мигающий курсор — символический */
        .cursor {
            display: inline-block;
            width: 0.6em;
            height: 1.2em;
            background-color: #0f0;
            vertical-align: middle;
            margin-left: 6px;
            animation: blink 1s step-end infinite;
            box-shadow: 0 0 5px #0f0;
        }

        /* Анимация мягкого пульсирования свечения */
        @keyframes subtleGlow {
            0% {
                text-shadow: 0 0 2px #0f0, 0 0 2px #0f0;
                opacity: 0.95;
            }
            100% {
                text-shadow: 0 0 8px #0f0, 0 0 4px #0f0;
                opacity: 1;
            }
        }

        /* Мигание курсора (как у терминала) */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Для очень маленьких экранов — чуть меньше отступы */
        @media (max-width: 480px) {
            .terminal {
                padding: 1.2rem;
                border-width: 1px;
            }
            .prompt {
                font-size: 0.9rem;
            }
        }
        
        /* Лёгкая «сетка» как у старого монитора (опционально) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 0, 0.02) 0px,
                rgba(0, 255, 0, 0.02) 2px,
                transparent 2px,
                transparent 4px
            );
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="terminal">
        <!-- Главное сообщение "Hello, World!" огромным шрифтом -->
        <div class="hello">Hello, World!</div>
        <!-- Декоративная строка, напоминающая ранние сетевые интерфейсы -->
        <div class="prompt">
            $ first_message_sent <span style="color:#0f0;">✔</span> 1969 / ARPANET
            <span class="cursor"></span>
        </div>
        <!-- Небольшой исторический намёк (не мешает восприятию) -->
        <div style="margin-top: 1rem; font-size: 0.7rem; color: #0a0; opacity: 0.7;">
            &gt; «Lo» — first protocol / «Hello, world» — hello from the past
        </div>
    </div>
</body>
</html>
